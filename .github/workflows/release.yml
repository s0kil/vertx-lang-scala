name: Release
on:
  push:
    tags:
      - '*'
jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'
      - name: Build
        run: mvn clean verify -B -ntp
      - name: Collect artifacts
        run: |
          mkdir -p staging
          cp vertx-lang-scala/target/vertx-lang-scala_3-*.jar staging/ 2>/dev/null || true
          cp vertx-lang-scala-test/target/vertx-lang-scala-test_3-*.jar staging/ 2>/dev/null || true
          # Remove test-jar artifacts from staging
          rm -f staging/*-tests.jar
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: staging/*.jar
